name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Versión estable y compatible con PyInstaller

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow librats ebooklib pynacl

    - name: Build with PyInstaller
      run: |
        $RATS_DLL = python -c "import librats_py, os; print(os.path.join(os.path.dirname(librats_py.__file__), 'rats.dll'))"
        pyinstaller --onefile --windowed --name BlogNet --hidden-import nacl --hidden-import _cffi_backend --collect-all nacl --add-binary "$RATS_DLL;." blog_p2p_gui.py

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: BlogNet-Windows
        path: dist/BlogNet.exe
